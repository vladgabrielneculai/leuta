name: Autori umani

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifică autorii și co-autorii commit-urilor
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Fără bază sau cu o bază care nu mai există (ex. după rescrierea istoricului): verifică tot istoricul.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          bad=$(git log --format='%h|%an <%ae>|%cn <%ce>%n%B' "$range" | grep -iE 'anthropic|^co-authored-by:.*claude|^claude-session:|\|claude <' || true)
          if [ -n "$bad" ]; then
            echo "Commit-uri cu autor sau co-autor AI:"
            echo "$bad"
            exit 1
          fi
